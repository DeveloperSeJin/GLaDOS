# GLaDOS 기본 정책 (GLaDOS 안에 들어 있는 기본 층)
# - 도구별로 "패턴: 판정". 판정은 allow(허용) / ask(승인) / deny(차단) / wait(대기)
# - 기본 → 연구원님(~/.glados/policy.yaml) → 서버 → 저장소 순서로 겹치고, 마지막에 맞는 규칙이 이긴다
# - 아무것도 맞지 않으면 차단
# - "@protected"는 보호 위치(키·비밀번호, 시스템 폴더, 셸 설정)에 맞는다
# - 코드에 박힌 규칙(안전장치 차단, 관리자 권한 승인, 음성, 실험 단계, 공유 서버 sudo)은 이 파일로 풀 수 없다

fs.search:
  "*": allow
  "@protected": ask

fs.inspect:              # 파일마다 첫머리를 읽고 모델이 질문에 답함 (읽기만)
  "*": allow
  "@protected": ask

fs.read:
  "*": allow
  "@protected": ask

fs.write_new:            # 새 파일만. 같은 이름이 있으면 이름을 바꿔 저장
  "*": allow
  "@protected": ask

fs.edit:                 # 원본 수정은 승인 + 체크포인트
  "*": ask

fs.trash:                # 삭제는 휴지통으로만
  "*": ask

shell.run:               # 허용 목록 밖은 승인. 코드 규칙: 잇거나 돌리면(; && | >) 승인, 보호 위치는 매번 승인,
  "*": ask               #   GLaDOS 안전장치 폴더 안에서는 아래 읽기 명령만
  # 상태 보기 (읽기만. 파일 내용을 쏟는 cat·type·rg는 넣지 않음: 파일은 fs.read로 읽는다)
  "pwd": allow
  "Get-Location": allow
  "ls": allow
  "ls *": allow
  "dir": allow
  "dir *": allow
  "Get-ChildItem": allow
  "Get-ChildItem *": allow
  "whoami": allow
  "hostname": allow
  "date": allow
  "Get-Date": allow
  "uptime": allow
  "df": allow
  "df *": allow
  "free": allow
  "free *": allow
  "ps": allow
  "ps *": allow
  "tasklist": allow
  "Get-Process": allow
  "Get-Process *": allow
  "systeminfo": allow
  "ipconfig": allow
  "ipconfig /all": allow
  "nvidia-smi": allow
  "nvidia-smi *": allow
  "which *": allow
  "where.exe *": allow
  "Get-Command *": allow
  # 버전
  "python --version": allow
  "python3 --version": allow
  "py --version": allow
  "uv --version": allow
  "node --version": allow
  "git --version": allow
  "ollama --version": allow
  # git 읽기
  "git status*": allow
  "git log*": allow
  "git diff*": allow
  "git show*": allow
  "git branch": allow
  "git branch -a": allow
  "git branch -v": allow
  "git branch -vv": allow
  "git remote -v": allow
  # 목록
  "pip list*": allow
  "pip show *": allow
  "uv pip list*": allow
  "ollama list*": allow
  "ollama ps*": allow

web.search:              # 외부 전송으로 세고 표시. 코드 규칙: 검색어에 개인 정보·이 대화에서 읽은 파일의 글이면 매번 승인
  "*": allow             #   (모든 검색을 묻게 하려면 ~/.glados/policy.yaml에 "*": ask)

web.fetch:               # 외부 전송으로 세고 표시. 코드 규칙: 이 컴퓨터·내부 네트워크 주소, 주소에 개인 정보면 매번 승인
  "*": allow

remote.gpu:              # 공유 서버 GPU 상태 (읽기만). 다른 사람 프로세스는 몇 개인지만
  "*": allow

remote.log:              # 서버의 로그 끝·폴더 목록. 코드 규칙: 내 홈·작업 폴더 밖, 다른 사람 폴더는 차단
  "*": allow

remote.exec:             # 서버에서 짧은 명령 (작업 폴더에서). 허용 목록 밖은 승인. 코드 규칙: sudo·su,
  "*": ask               #   kill·reboot·systemctl, 다른 사람 폴더(/home/다른사람, ~다른사람, /root)는 차단,
  # 상태 보기             #   지우기·옮기기·덮어쓰기와 백그라운드로 띄우기(nohup, tmux new, &)는 매번 승인,
                         #   잇거나 돌리면(; && | >) 승인. 학습 실행은 remote.run
  "nvidia-smi -L": allow           # 그냥 nvidia-smi는 다른 사람 프로세스까지 보여 줘서 승인 (GPU 상태는 remote.gpu로)
  "nvidia-smi --query-gpu*": allow
  "df": allow
  "df *": allow
  "du *": allow
  "free": allow
  "free *": allow
  "uptime": allow
  "whoami": allow
  "id": allow
  "hostname": allow
  "uname*": allow
  "quota*": allow
  "pwd": allow
  # 내 파일 보기 (다른 사람 폴더는 코드 규칙이 막음)
  "ls": allow
  "ls *": allow
  "cat *": allow
  "head *": allow
  "tail *": allow
  "wc *": allow
  "grep *": allow
  # git 읽기
  "git status*": allow
  "git log*": allow
  "git diff*": allow
  "git show*": allow
  "git branch*": allow
  "git remote -v": allow
  # 버전·목록
  "python --version": allow
  "python3 --version": allow
  "nvcc --version": allow
  "pip list*": allow
  "pip show *": allow
  "conda env list": allow
  "conda list*": allow
  "tmux ls": allow

remote.projects:         # 서버의 프로젝트 목록, 프로젝트 하나의 파일 (README·실행 파일·인자·설정). 읽기만
  "*": allow

remote.run:              # 서버에서 학습 실행 (tmux). 코드 규칙: 매번 승인 (실행 카드: GPU·명령·커밋·규칙),
  "*": ask               #   sudo·kill·다른 사람 폴더는 차단. 여기를 allow로 바꿔도 묻는다 (deny는 막는다)

remote.stop:             # 내 실행 멈추기 (Ctrl+C, 15초 뒤에도 돌면 세션 닫기). 코드 규칙: 매번 승인
  "*": ask

git.snapshot:
  "*": allow

ask.user:
  "*": allow

mcp:                     # 등록하지 않은 외부 MCP 서버
  "*": deny
