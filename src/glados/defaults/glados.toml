# GLaDOS 설정. 장비마다 이 파일만 고치면 된다.
# GLaDOS는 이 파일을 고칠 수 없다 (안전장치). 편집기로 직접 여세요.

[model]
mode = "normal"                  # "normal" 또는 "low" (GPU 8GB 같은 작은 장비)
host = "http://localhost:11434"  # Ollama 주소. 다른 컴퓨터의 모델을 쓰려면 여기만 바꾼다
think = false                    # 생각 모드. 1단계에서 켬/끔을 비교한다
keep_alive = "30m"

[model.normal]
name = "qwen3.5:9b"              # 맥은 "qwen3.5:9b-mlx"
num_ctx = 32768

[model.low]
name = "qwen3.5:4b"
num_ctx = 16384

[ui]
language = "ko"         # 화면 언어: "ko" 또는 "en". 답은 물은 언어로 한다 (한국어로 물으면 한국어)
screen = "tui"          # 화면 종류: "tui"(창 전체를 쓰는 화면) 또는 "plain"(줄 화면, 한글 입력이 TUI에서 이상할 때)
motion = true           # TUI에서 작업 중에 로고의 점이 움직임. 한글 입력이 흔들리면 false
notify = true           # 서버 실행이 끝나거나 손실이 NaN이면 OS 알림(Windows 알림 센터 등)으로도 알림

[loop]
max_steps = 12          # 한 작업 최대 루프
format_retries = 2      # 형식 오류 재요청
same_call_limit = 3     # 같은 호출이 연속 몇 번이면 멈출지
tool_error_limit = 2    # 같은 도구 오류 몇 번이면 보고할지
local_timeout_s = 60
remote_timeout_s = 300

[web]
# 웹 검색을 맡길 곳: "tavily" | "brave" | "searxng" | "ollama". 비우면 검색 없음 (페이지 읽기는 됨)
# API 키는 이 파일에 적지 않고 환경 변수로: TAVILY_API_KEY, BRAVE_API_KEY, OLLAMA_API_KEY
# 검색어와 읽은 주소는 외부 전송으로 세어 머리글 칩과 /sent에 보여 주고 logs/egress.jsonl에 남긴다
search = ""
searxng_url = "http://localhost:8888"   # search = "searxng"일 때 (settings.yml의 search: formats에 json을 켜야 함)
results = 5                             # 검색 한 번에 받을 결과 수 (1~10)

[privacy]
# 웹으로 나가는 글(검색어, 주소)에 이 이름이 있으면 먼저 묻는다. 이메일·전화번호·파일 경로·키 모양,
# 이 대화에서 읽은 파일의 글은 따로 적지 않아도 묻는다
names = []              # 예: ["홍길동", "Gildong Hong"]

[user]
name = "saul_park"      # 공유 서버의 내 사용자 이름 (tmux 세션 이름에 씀)
