# 접근 권한 (integration-decisions.md 3장)
# - 디스크 어디든 읽기·찾기·새 파일 만들기는 허용
# - 보호 위치(키·비밀번호, 시스템·자동 실행 폴더, 셸 설정)는 승인 후에만
# - GLaDOS 안전장치(이 폴더 전체, 정책 파일, GLaDOS 소스)는 GLaDOS가 고칠 수 없음
# 위 규칙은 코드에 들어 있다. 여기서는 기본 검색 범위와 추가 보호 위치만 정한다.

# "찾아줘"라고만 하면 여기서 찾는다. 내용 색인도 이 범위를 훑는다.
# "*" = 컴퓨터의 모든 드라이브 (Windows: 고정·이동식 드라이브와 구글 드라이브, 리눅스·맥: 홈과 붙인 볼륨). M7.5
# 좁히려면 예: ["~/Downloads", "~/Documents", "~/Desktop"]
search_default = ["*"]

# 보호 위치를 더 넣고 싶으면 여기에 (예: "~/연구/비공개")
extra_protected = []

# GLaDOS의 작업 공간: GLaDOS를 자기 폴더(소스·설정 폴더)에서 열면 작업 폴더를 여기로 옮긴다
# (자기 폴더에서는 파일을 만들거나 명령을 돌릴 수 없으므로). 비우면 문서 폴더 안의 GLaDOS
workspace = ""
